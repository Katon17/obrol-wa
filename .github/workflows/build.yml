name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (Ubuntu, GTK3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: System dependencies (GTK3)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o obrol-bin .

      - name: Version
        run: ./obrol-bin --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: obrol-linux-x86_64
          path: obrol-bin
