name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release tarball + .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: System dependencies (GTK3)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev dpkg-dev

      - name: Build
        # CGO_CFLAGS dipin: kode C cgo (sqlite3) tidak boleh mewarisi -march
        # default runner (x86-64-v3 = AVX) — biner rilis malah mati SIGILL di
        # CPU pra-AVX tepat di sqlite3_open_v2 (issue #14). GOAMD64=v1 saja
        # hanya menjaga sisi Go.
        run: GOAMD64=v1 CGO_CFLAGS="-O2 -Wno-deprecated-declarations -march=x86-64 -mtune=generic" go build -trimpath -ldflags="-s -w" -o obrol .

      - name: Drop x86-64 ISA note (old-CPU safety)
        # Runner images and shared build caches can bake an x86-64-v2/v3 ISA
        # note into the executable (crt/C objects); glibc then refuses to
        # start it on pre-AVX2 CPUs (issue: "CPU ISA level is lower than
        # required"). Removing the note makes the binary baseline by
        # construction, on every runner and cache state.
        run: objcopy --remove-section=.note.gnu.property obrol

      - name: Guard — binary must be x86-64-baseline
        run: |
          isa="$(readelf -nW obrol | sed -n 's/.*x86 ISA needed: *//p')"
          case "$isa" in ""|x86-64-baseline) ;; *) echo "::error::Release binary needs '$isa', must be x86-64-baseline"; exit 1;; esac

      - name: Build Debian package
        run: DEB_MAINTAINER="Katon Bagaskoro <cimong2356@gmail.com>" ./build-deb.sh

      - name: Package tarball
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p stage/obrol
          cp -r assets screenshots .github LICENSE README.md README.id.md \
                CHANGELOG.md CONTRIBUTING.md CODE_OF_CONDUCT.md \
                install.sh build.sh build-deb.sh obrol.desktop go.mod go.sum stage/obrol/
          cp *.go stage/obrol/
          cp obrol stage/obrol/
          tar czf "obrol-$V-linux-x86_64.tar.gz" -C stage obrol

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            obrol-*.tar.gz
            dist/*.deb
          generate_release_notes: true
